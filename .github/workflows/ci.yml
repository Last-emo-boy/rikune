name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install baseline Python dependencies
        run: python -m pip install --require-hashes -r requirements.windows.lock.txt

      - name: Build TypeScript
        run: npm run build

      - name: Validate PowerShell installer contracts
        shell: pwsh
        run: ./scripts/verify-powershell-installers.ps1

      - name: Build runtime-node package
        run: cd packages/runtime-node && npm run build

      - name: Lint
        run: npm run lint

      - name: Validate Python worker syntax
        run: python -m py_compile workers/static_worker.py workers/speakeasy_compat.py

      - name: Run full unit test suite
        run: >
          npm test -- --runInBand --forceExit --testPathPatterns="tests/unit/"
        timeout-minutes: 20

      - name: Run integration tests
        run: >
          npm test -- --runInBand --forceExit --testPathPatterns="tests/integration/"
        timeout-minutes: 10

      - name: Run Node integration smoke tests
        run: npm run test:node
        timeout-minutes: 15

      - name: Generate coverage report
        run: >
          npm run test:coverage -- --runInBand --forceExit --testPathPatterns="tests/unit/"
        timeout-minutes: 20
        continue-on-error: true

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Validate npm package contents
        run: npm run pack:dry-run

      - name: Create npm package tarball
        run: npm pack

      - name: Upload package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: npm-package
          path: '*.tgz'

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install JavaScript dependencies
        run: npm ci

      - name: npm audit (high + critical)
        run: npm audit --audit-level=high

      - name: Install pip-audit
        run: python -m pip install --require-hashes -r requirements.audit.lock.txt

      - name: pip-audit Python dependencies
        run: |
          pip-audit --require-hashes --no-deps -r requirements.lock.txt
          pip-audit --require-hashes --no-deps -r requirements.windows.lock.txt
          pip-audit --require-hashes --no-deps -r src/plugins/angr/requirements.lock.txt
          pip-audit --require-hashes --no-deps -r workers/requirements-dynamic.lock.txt
          pip-audit --require-hashes --no-deps -r workers/requirements-dynamic.windows.lock.txt

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6d786de4d6f3531a740e445b53a42b622bbbace8 # v3
        with:
          languages: javascript-typescript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@6d786de4d6f3531a740e445b53a42b622bbbace8 # v3

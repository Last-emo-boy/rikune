name: Recover v1.3.0 Release

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Enter release-v1.3.0 exactly'
        required: true
        type: string
      dry_run:
        description: 'Validate all artifacts without publishing'
        required: true
        default: true
        type: boolean

concurrency:
  group: recover-v1.3.0
  cancel-in-progress: false

env:
  NPM_REGISTRY_URL: https://registry.npmjs.org
  RELEASE_TAG: v1.3.0
  RELEASE_SHA: cc1003a3499543cf510b70e182939f83d1d76e85
  ROOT_VERSION: 1.3.0
  WORKSPACE_VERSION: 1.1.0

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Validate operator intent
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = release-v1.3.0
          case "$DRY_RUN" in
            true|false) ;;
            *) echo "dry_run must be true or false" >&2; exit 1 ;;
          esac
          echo "RELEASE_DRY_RUN=$DRY_RUN" >> "$GITHUB_ENV"

      - name: Checkout immutable v1.3.0 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: cc1003a3499543cf510b70e182939f83d1d76e85
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag, ancestry, and package matrix
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG" main
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$RELEASE_SHA"
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
          test "$(node -p "require('./package.json').version")" = "$ROOT_VERSION"
          for workspace in shared plugin-sdk runtime-node windows-host-agent; do
            test "$(node -p "require('./packages/$workspace/package.json').version")" = "$WORKSPACE_VERSION"
            test "$(node -p "require('./packages/$workspace/package.json').private === true ? 'private' : 'public'")" = public
          done

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Pin npm CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@10.9.0 --ignore-scripts
          test "$(npm --version)" = 10.9.0

      - name: Install and build immutable source
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          python -m py_compile workers/static_worker.py workers/speakeasy_compat.py
          git diff --exit-code

      - name: Run original v1.3.0 release tests
        shell: bash
        run: |
          set -euo pipefail
          npm test -- --runInBand \
            tests/unit/tool-help.test.ts \
            tests/unit/sample-ingest.test.ts \
            tests/unit/dynamic-dependencies.test.ts \
            tests/unit/dotnet-metadata-extract.test.ts \
            tests/unit/system-health.test.ts

      - name: Pack and validate release set
        shell: bash
        run: |
          set -euo pipefail
          mkdir release
          npm pack --workspace packages/shared --ignore-scripts --json --pack-destination release > release/meta-shared.json
          npm pack --workspace packages/plugin-sdk --ignore-scripts --json --pack-destination release > release/meta-plugin-sdk.json
          npm pack --workspace packages/runtime-node --ignore-scripts --json --pack-destination release > release/meta-runtime-node.json
          npm pack --workspace packages/windows-host-agent --ignore-scripts --json --pack-destination release > release/meta-windows-host-agent.json
          npm pack --ignore-scripts --json --pack-destination release > release/meta-root.json

          matrix=(
            'shared|@rikune/shared|1.1.0'
            'plugin-sdk|@rikune/plugin-sdk|1.1.0'
            'runtime-node|@rikune/runtime-node|1.1.0'
            'windows-host-agent|@rikune/windows-host-agent|1.1.0'
            'root|rikune|1.3.0'
          )
          for item in "${matrix[@]}"; do
            IFS='|' read -r key expected_name expected_version <<< "$item"
            metadata="release/meta-$key.json"
            jq -e --arg name "$expected_name" --arg version "$expected_version" \
              'length == 1 and .[0].name == $name and .[0].version == $version and (. | length) == 1' \
              "$metadata" >/dev/null
            tarball="./release/$(jq -r '.[0].filename' "$metadata")"
            test -f "$tarball"
            test "$(tar -xOf "$tarball" package/package.json | jq -r .name)" = "$expected_name"
            test "$(tar -xOf "$tarball" package/package.json | jq -r .version)" = "$expected_version"
            tar -tzf "$tarball" | grep -Fx package/dist/index.js >/dev/null
            tar -tzf "$tarball" | grep -Fx package/dist/index.d.ts >/dev/null
          done

          jq -s '[.[][] | {name, version, filename, integrity, shasum, size, unpackedSize}]' \
            release/meta-*.json > release/manifest.json
          sha256sum release/*.tgz > release/SHA256SUMS
          test "$(find release -maxdepth 1 -type f -name '*.tgz' | wc -l)" -eq 5

      - name: Verify clean consumer installation from local tarballs
        shell: bash
        run: |
          set -euo pipefail
          consumer="$RUNNER_TEMP/rikune-v1.3.0-consumer"
          mkdir "$consumer"
          npm install --prefix "$consumer" --no-audit --no-fund \
            "$(pwd)/release/rikune-shared-1.1.0.tgz" \
            "$(pwd)/release/rikune-plugin-sdk-1.1.0.tgz" \
            "$(pwd)/release/rikune-runtime-node-1.1.0.tgz" \
            "$(pwd)/release/rikune-windows-host-agent-1.1.0.tgz" \
            "$(pwd)/release/rikune-1.3.0.tgz"
          node - "$consumer" <<'NODE'
          const path = require('node:path');
          const consumer = process.argv[2];
          const expected = new Map([
            ['rikune', '1.3.0'],
            ['@rikune/shared', '1.1.0'],
            ['@rikune/plugin-sdk', '1.1.0'],
            ['@rikune/runtime-node', '1.1.0'],
            ['@rikune/windows-host-agent', '1.1.0'],
          ]);
          for (const [name, version] of expected) {
            const manifest = require(path.join(consumer, 'node_modules', name, 'package.json'));
            if (manifest.name !== name || manifest.version !== version) {
              throw new Error(`consumer package mismatch: ${name}`);
            }
          }
          NODE
          node -e "require('$consumer/node_modules/better-sqlite3'); console.log('native dependency ok')"
          npm audit --prefix "$consumer" --omit=dev --audit-level=high

      - name: Validate npm publish commands
        shell: bash
        run: |
          set -euo pipefail
          for metadata in \
            release/meta-shared.json \
            release/meta-plugin-sdk.json \
            release/meta-runtime-node.json \
            release/meta-windows-host-agent.json \
            release/meta-root.json; do
            tarball="./release/$(jq -r '.[0].filename' "$metadata")"
            npm publish "$tarball" --dry-run --provenance --access public --tag latest --ignore-scripts
          done

      - name: Authenticate npm publisher
        if: env.RELEASE_DRY_RUN != 'true'
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          identity=$(npm whoami --registry "$NPM_REGISTRY_URL")
          npm owner ls rikune --registry "$NPM_REGISTRY_URL" | awk '{print $1}' | grep -Fx "$identity"
          echo "Authenticated npm owner: $identity"

      - name: Publish or recover exact npm artifacts
        if: env.RELEASE_DRY_RUN != 'true'
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          matrix=(
            'release/meta-shared.json'
            'release/meta-plugin-sdk.json'
            'release/meta-runtime-node.json'
            'release/meta-windows-host-agent.json'
            'release/meta-root.json'
          )
          for metadata in "${matrix[@]}"; do
            name=$(jq -r '.[0].name' "$metadata")
            version=$(jq -r '.[0].version' "$metadata")
            expected=$(jq -r '.[0].integrity' "$metadata")
            tarball="./release/$(jq -r '.[0].filename' "$metadata")"
            encoded=$(node -p 'encodeURIComponent(process.argv[1])' "$name")
            status=$(curl --silent --show-error --output remote.json --write-out '%{http_code}' \
              "$NPM_REGISTRY_URL/$encoded/$version")
            case "$status" in
              200)
                test "$(jq -r '.dist.integrity' remote.json)" = "$expected"
                echo "$name@$version already has the expected integrity"
                ;;
              404)
                npm publish "$tarball" --provenance --access public --tag latest --ignore-scripts
                ;;
              *)
                echo "Unexpected npm registry status $status for $name@$version" >&2
                exit 1
                ;;
            esac

            verified=false
            for attempt in $(seq 1 12); do
              status=$(curl --silent --show-error --output remote.json --write-out '%{http_code}' \
                "$NPM_REGISTRY_URL/$encoded/$version")
              if [[ "$status" == 200 ]]; then
                test "$(jq -r '.dist.integrity' remote.json)" = "$expected"
                verified=true
                break
              fi
              sleep 10
            done
            test "$verified" = true
          done

      - name: Verify clean installation from the public registry
        if: env.RELEASE_DRY_RUN != 'true'
        shell: bash
        run: |
          set -euo pipefail
          consumer="$RUNNER_TEMP/rikune-v1.3.0-registry-consumer"
          mkdir "$consumer"
          npm install --prefix "$consumer" --no-fund \
            rikune@1.3.0 \
            @rikune/runtime-node@1.1.0 \
            @rikune/windows-host-agent@1.1.0
          npm audit --prefix "$consumer" --omit=dev --audit-level=high
          test "$(node -p "require('$consumer/node_modules/rikune/package.json').version")" = 1.3.0
          test "$(node -p "require('$consumer/node_modules/@rikune/plugin-sdk/package.json').version")" = 1.1.0
          test "$(node -p "require('$consumer/node_modules/@rikune/shared/package.json').version")" = 1.1.0
          node -e "require('$consumer/node_modules/better-sqlite3'); console.log('native dependency ok')"

      - name: Create or update GitHub Release
        if: env.RELEASE_DRY_RUN != 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v1.3.0
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Immutable source: `cc1003a3499543cf510b70e182939f83d1d76e85`

            npm release set:
            - `rikune@1.3.0`
            - `@rikune/shared@1.1.0`
            - `@rikune/plugin-sdk@1.1.0`
            - `@rikune/runtime-node@1.1.0`
            - `@rikune/windows-host-agent@1.1.0`
          files: |
            release/*.tgz
            release/manifest.json
            release/SHA256SUMS

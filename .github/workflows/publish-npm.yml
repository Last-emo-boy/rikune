name: Release v1.4.1

on:
  push:
    tags: ['v1.4.1']
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact release version'
        required: true
        default: '1.4.1'
        type: string
      dry_run:
        description: 'Run reversible preflight gates only'
        required: true
        default: true
        type: boolean
      release_phase:
        description: 'Stage candidates, or verify a package published manually with npm 2FA'
        required: true
        default: stage
        type: choice
        options:
          - stage
          - verify-human-published

concurrency:
  group: release-v1.4.1-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_VERSION: '1.4.1'
  RELEASE_TAG: 'v1.4.1'
  NPM_PACKAGE: rikune
  NPM_REGISTRY_URL: https://registry.npmjs.org
  STATIC_IMAGE: ghcr.io/last-emo-boy/rikune-analyzer-static

jobs:
  preflight:
    name: Test and stage immutable npm candidate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    outputs:
      dry_run: ${{ steps.release.outputs.dry_run }}
      phase: ${{ steps.release.outputs.phase }}
      tarball: ${{ steps.pack.outputs.tarball }}
      integrity: ${{ steps.pack.outputs.integrity }}
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate exact v1.4.1 release ref
        id: release
        shell: bash
        env:
          DISPATCH_VERSION: ${{ inputs.version || '1.4.1' }}
          DISPATCH_DRY_RUN: ${{ inputs.dry_run || false }}
          DISPATCH_PHASE: ${{ inputs.release_phase || 'stage' }}
        run: |
          set -euo pipefail
          package_version=$(node -p "require('./package.json').version")
          test "$package_version" = "$RELEASE_VERSION"
          test "$(node -p "require('./package.json').contentPolicy?.class")" = dual-use
          test -s DISCLOSURE
          test "$DISPATCH_VERSION" = "$RELEASE_VERSION"
          dry_run=false
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then dry_run="$DISPATCH_DRY_RUN"; fi
          phase=stage
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then phase="$DISPATCH_PHASE"; fi
          test "$phase" = stage || test "$phase" = verify-human-published
          if [[ "$phase" == verify-human-published ]]; then
            test "$GITHUB_EVENT_NAME" = workflow_dispatch
            test "$dry_run" = false
          fi
          if [[ "$dry_run" != true ]]; then
            test "$GITHUB_REF_TYPE" = tag
            test "$GITHUB_REF_NAME" = "$RELEASE_TAG"
            git fetch --no-tags origin main
            git merge-base --is-ancestor HEAD origin/main
          elif [[ "$GITHUB_REF_TYPE" == tag ]]; then
            test "$GITHUB_REF_NAME" = "$RELEASE_TAG"
          fi
          echo "dry_run=$dry_run" >> "$GITHUB_OUTPUT"
          echo "phase=$phase" >> "$GITHUB_OUTPUT"

      - name: Require successful exact-SHA main CI before release mutation
        if: steps.release.outputs.dry_run != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=push&status=success&head_sha=$GITHUB_SHA&per_page=100" \
            | jq -e --arg sha "$GITHUB_SHA" '
                [.workflow_runs[] |
                  select(.head_sha == $sha and .head_branch == "main" and
                    .event == "push" and .conclusion == "success")] |
                length > 0
              '

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Pin npm CLI
        run: |
          npm install --global npm@10.9.0 --ignore-scripts
          test "$(npm --version)" = 10.9.0

      - name: Install dependencies and build
        run: |
          npm ci
          npm audit --audit-level=high
          npm run build

      - name: Audit exact static Python dependency closures
        run: |
          python -m pip install --require-hashes -r requirements.audit.lock.txt
          pip-audit --require-hashes --no-deps -r requirements.lock.txt
          pip-audit --require-hashes --no-deps -r requirements.windows.lock.txt
          pip-audit --require-hashes --no-deps -r src/plugins/angr/requirements.lock.txt
          pip-audit --require-hashes --no-deps -r workers/requirements-dynamic.lock.txt
          pip-audit --require-hashes --no-deps -r workers/requirements-dynamic.windows.lock.txt

      - name: Verify generated Docker release inputs and Compose contracts
        run: |
          npm run docker:generate:all
          git diff --exit-code -- static-profile.lock.json docker/Dockerfile.analyzer docker/Dockerfile.hybrid docker-compose.analyzer.yml docker-compose.hybrid.yml
          test -z "$(git status --porcelain -- static-profile.lock.json docker/Dockerfile.analyzer docker/Dockerfile.hybrid docker-compose.analyzer.yml docker-compose.hybrid.yml)"
          bash scripts/verify-compose-config.sh

      - name: Run release test suite
        run: |
          npm run lint
          npm test -- --runInBand
          npm run test:node
          pwsh -NoProfile -File scripts/verify-powershell-installers.ps1

      - name: Pack immutable npm artifact
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          npm pkg set "gitHead=$GITHUB_SHA"
          npm pack --ignore-scripts --json > npm-pack-metadata.json
          tarball=$(node -e "const x=require('./npm-pack-metadata.json'); if(x.length!==1)process.exit(1); process.stdout.write(x[0].filename)")
          integrity=$(node -e "const x=require('./npm-pack-metadata.json'); process.stdout.write(x[0].integrity)")
          test -f "$tarball"
          test "$(node -e "const x=require('./npm-pack-metadata.json'); process.stdout.write(x[0].version)")" = "$RELEASE_VERSION"
          test "$(tar -xOf "$tarball" package/package.json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).gitHead||""))')" = "$GITHUB_SHA"
          test "$(tar -xOf "$tarball" package/package.json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).contentPolicy?.class||""))')" = dual-use
          tar -tf "$tarball" | grep -Fx package/DISCLOSURE
          # JavaScript template interpolation must remain literal for Node.
          # shellcheck disable=SC2016
          node -e 'const x=require("./npm-pack-metadata.json"); for (const path of ["bin/rikune.js","bin/rikune-docker.js","bin/rikune-agent.js"]) { const file=x[0].files.find(item=>item.path===path); if(!file || (file.mode & 0o111)===0) throw new Error(`packed CLI is missing or non-executable: ${path}`) }'
          for cli in rikune.js rikune-docker.js rikune-agent.js; do
            tar -tf "$tarball" | grep -Fx "package/bin/$cli"
          done
          # JavaScript template interpolation must remain literal for Node.
          # shellcheck disable=SC2016
          RELEASE_TARBALL="$tarball" RELEASE_INTEGRITY="$integrity" node -e '
            const fs=require("fs");
            const manifest={
              schema_version:1,
              package:process.env.NPM_PACKAGE,
              version:process.env.RELEASE_VERSION,
              tag:process.env.RELEASE_TAG,
              commit:process.env.GITHUB_SHA,
              ref:process.env.GITHUB_REF,
              repository:process.env.GITHUB_REPOSITORY,
              workflow:process.env.GITHUB_WORKFLOW,
              run_id:process.env.GITHUB_RUN_ID,
              run_attempt:process.env.GITHUB_RUN_ATTEMPT,
              run_url:`https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
              tarball:process.env.RELEASE_TARBALL,
              integrity:process.env.RELEASE_INTEGRITY,
            };
            fs.writeFileSync("release-candidate-manifest.json",`${JSON.stringify(manifest,null,2)}\n`);
          '
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "integrity=$integrity" >> "$GITHUB_OUTPUT"

      - name: Verify fresh install from tarball
        run: node scripts/verify-release-package.mjs "${{ steps.pack.outputs.tarball }}" "$RELEASE_VERSION"

      - name: Upload exact npm evidence for final verification
        if: >-
          steps.release.outputs.dry_run != 'true' &&
          steps.release.outputs.phase == 'verify-human-published'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-release-evidence
          path: |
            ${{ steps.pack.outputs.tarball }}
            npm-pack-metadata.json
            release-candidate-manifest.json
            DISCLOSURE
          if-no-files-found: error
          retention-days: 7

  hybrid-build-verify:
    name: Build and verify exact Hybrid release image
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    outputs:
      revision: ${{ steps.contract.outputs.revision }}
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Generate exact committed Hybrid target
        run: |
          npm ci
          npm run build
          npm run docker:generate:hybrid
          git diff --exit-code -- docker/Dockerfile.hybrid docker-compose.hybrid.yml
          test -z "$(git status --porcelain -- docker/Dockerfile.hybrid docker-compose.hybrid.yml)"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build exact linux/amd64 Hybrid release image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./docker/Dockerfile.hybrid
          platforms: linux/amd64
          load: true
          push: false
          tags: rikune-analyzer-hybrid:release
          labels: |
            org.opencontainers.image.source=https://github.com/Last-emo-boy/rikune
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=1.4.1
            org.opencontainers.image.rikune.profile=hybrid
          cache-from: type=gha,scope=rikune-hybrid-v1.4.1
          cache-to: type=gha,mode=max,scope=rikune-hybrid-v1.4.1

      - name: Verify hardened Hybrid startup and bind revision
        id: contract
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/verify-hybrid-container.sh rikune-analyzer-hybrid:release "$GITHUB_SHA" "$RELEASE_VERSION"
          echo "revision=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  static-build-push:
    name: Stage or resolve immutable static OCI candidate
    needs: [preflight, hybrid-build-verify]
    if: needs.preflight.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
      candidate: ${{ steps.image.outputs.candidate }}
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Revalidate remote annotated tag before registry mutation
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git cat-file -t "$RELEASE_TAG")" = tag
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
          remote_commit=$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG^{}" | awk '{print $1}')
          test "$remote_commit" = "$GITHUB_SHA"

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Generate exact static target
        run: |
          npm ci
          npm run build
          npm run docker:generate:static
          git diff --exit-code -- static-profile.lock.json docker/Dockerfile.analyzer docker-compose.analyzer.yml

      - name: Set immutable candidate reference
        id: image
        run: echo "candidate=$STATIC_IMAGE:candidate-$RELEASE_VERSION-$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Enforce immutable candidate state for this phase
        id: candidate_state
        shell: bash
        env:
          RELEASE_PHASE: ${{ needs.preflight.outputs.phase }}
          CANDIDATE: ${{ steps.image.outputs.candidate }}
        run: |
          set -euo pipefail
          set +e
          docker buildx imagetools inspect "$CANDIDATE" > candidate-inspect.txt 2> candidate-inspect.err
          inspect_status=$?
          set -e
          if [[ "$RELEASE_PHASE" == stage ]]; then
            if [[ "$inspect_status" -eq 0 ]]; then
              echo "Immutable candidate already exists; refusing to overwrite $CANDIDATE" >&2
              exit 1
            fi
            if ! bash scripts/registry-ref-is-absent.sh "$CANDIDATE" candidate-inspect.err; then
              cat candidate-inspect.err >&2
              echo "Unable to prove that immutable candidate is absent; refusing to build." >&2
              exit 1
            fi
          elif [[ "$RELEASE_PHASE" == verify-human-published ]]; then
            if [[ "$inspect_status" -ne 0 ]]; then
              cat candidate-inspect.err >&2
              echo "The staged immutable candidate is missing; verification cannot create it." >&2
              exit 1
            fi
            existing_digest=$(awk '/^Digest:/ {print $2; exit}' candidate-inspect.txt)
            [[ "$existing_digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            echo "existing_digest=$existing_digest" >> "$GITHUB_OUTPUT"
          else
            echo "Unsupported release phase: $RELEASE_PHASE" >&2
            exit 1
          fi

      - name: Build and push linux/amd64 candidate
        id: build
        if: needs.preflight.outputs.phase == 'stage'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./docker/Dockerfile.analyzer
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.candidate }}
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.source=https://github.com/Last-emo-boy/rikune
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=1.4.1
            org.opencontainers.image.rikune.profile=static
          cache-from: type=gha,scope=rikune-static-v1.4.1
          cache-to: type=gha,mode=max,scope=rikune-static-v1.4.1

      - name: Bind immutable candidate digest
        id: digest
        shell: bash
        env:
          RELEASE_PHASE: ${{ needs.preflight.outputs.phase }}
          BUILT_DIGEST: ${{ steps.build.outputs.digest }}
          EXISTING_DIGEST: ${{ steps.candidate_state.outputs.existing_digest }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_PHASE" == stage ]]; then
            digest="$BUILT_DIGEST"
          else
            digest="$EXISTING_DIGEST"
          fi
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Generate registry-derived SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.STATIC_IMAGE }}@${{ steps.digest.outputs.digest }}
          format: spdx-json
          output-file: static-image.spdx.json
          upload-artifact: false

      - name: Sign GitHub build provenance attestation
        if: needs.preflight.outputs.phase == 'stage'
        uses: actions/attest-build-provenance@8beda2b7ed98355c0e97c0a63bec38ae472e66c4 # v4
        with:
          subject-name: ${{ env.STATIC_IMAGE }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

      - name: Sign GitHub SBOM attestation
        if: needs.preflight.outputs.phase == 'stage'
        uses: actions/attest-sbom@51e74621a501c89df81fc1391c5a8f4cfc9fab2f # v3
        with:
          subject-name: ${{ env.STATIC_IMAGE }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          sbom-path: static-image.spdx.json
          push-to-registry: true

      - name: Install Cosign
        if: needs.preflight.outputs.phase == 'stage'
        uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9 # v3

      - name: Keyless-sign immutable candidate digest
        if: needs.preflight.outputs.phase == 'stage'
        run: cosign sign --yes "$STATIC_IMAGE@${{ steps.digest.outputs.digest }}"

      - name: Freeze static release evidence
        run: |
          printf '%s\n' '${{ steps.digest.outputs.digest }}' > static-image-digest.txt
          printf '%s\n' '${{ steps.image.outputs.candidate }}' > static-image-candidate.txt

      - name: Upload static release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: static-oci-evidence
          path: |
            static-image.spdx.json
            static-image-digest.txt
            static-image-candidate.txt
            static-profile.lock.json
          if-no-files-found: error
          retention-days: 7

  static-verify:
    name: Verify static OCI in GHCR
    needs: [preflight, static-build-push]
    if: needs.preflight.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
      attestations: read
    outputs:
      digest: ${{ steps.contract.outputs.digest }}
    steps:
      - name: Bind verified digest
        id: contract
        run: echo "digest=${{ needs.static-build-push.outputs.digest }}" >> "$GITHUB_OUTPUT"

      - name: Checkout release contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Install Cosign
        uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9 # v3

      - name: Verify registry digest and exact runnable platform
        shell: bash
        run: |
          set -euo pipefail
          ref="$STATIC_IMAGE@${{ needs.static-build-push.outputs.digest }}"
          docker buildx imagetools inspect --raw "$ref" > manifest.json
          jq -e '
            if has("manifests") then
              ([.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64")] | length) == 1 and
              ([.manifests[] | select(.platform.os != "linux" or .platform.architecture != "amd64") |
                select(.annotations["vnd.docker.reference.type"] != "attestation-manifest")] | length) == 0
            else .os == "linux" and .architecture == "amd64" end
          ' manifest.json
          docker pull "$ref"
          test "$(docker image inspect "$ref" --format '{{.Architecture}}/{{.Os}}')" = amd64/linux
          test "$(docker image inspect "$ref" --format '{{index .Config.Labels "org.opencontainers.image.version"}}')" = 1.4.1
          test "$(docker image inspect "$ref" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"
          test "$(docker image inspect "$ref" --format '{{index .Config.Labels "org.opencontainers.image.rikune.profile"}}')" = static

      - name: Verify embedded lock and every required backend
        shell: bash
        run: |
          set -euo pipefail
          ref="$STATIC_IMAGE@${{ needs.static-build-push.outputs.digest }}"
          docker image inspect "$ref" --format '{{json .Config.Env}}' | jq -e 'index("RIKUNE_DOCKER_PROFILE=static") != null'
          bash scripts/verify-static-container.sh "$ref"
          if docker run --rm -e RIKUNE_DOCKER_PROFILE=full "$ref" node --version; then
            echo "static image accepted a downgraded profile" >&2
            exit 1
          fi
          mapfile -t locked_env < <(jq -r '.required_backends[].environment[].name' static-profile.lock.json | sort -u)
          for name in "${locked_env[@]}"; do
            override="$name=/__rikune_forbidden_override__"
            if docker run --rm -e "$override" "$ref" node --version; then
              echo "static image accepted backend override: $override" >&2
              exit 1
            fi
          done
          invalid_lock="$RUNNER_TEMP/invalid-static-profile.lock.json"
          printf '{}\n' > "$invalid_lock"
          if docker run --rm --mount "type=bind,src=$invalid_lock,dst=/app/static-profile.lock.json,readonly" "$ref" node --version; then
            echo "static image accepted an invalid embedded lock" >&2
            exit 1
          fi
          container=$(docker create "$ref")
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          docker cp "$container:/app/static-profile.lock.json" image-static-profile.lock.json
          cmp static-profile.lock.json image-static-profile.lock.json
          docker run --rm --entrypoint node "$ref" -e '
            const fs=require("fs"),cp=require("child_process");
            const lock=JSON.parse(fs.readFileSync("/app/static-profile.lock.json","utf8"));
            for(const backend of lock.required_backends){
              const stat=fs.lstatSync(backend.path);
              if(!stat.isFile() || stat.isSymbolicLink() || stat.nlink!==1 || stat.size>64*1024*1024 || (stat.mode&0o111)===0) throw new Error(`invalid backend path: ${backend.name}`);
              const result=cp.spawnSync(backend.path,backend.version_args,{encoding:"utf8",timeout:30000,maxBuffer:1024*1024});
              if(result.error || result.signal || result.status===null || !backend.allowed_exit_codes.includes(result.status)) throw new Error(`invalid backend exit: ${backend.name}`);
              let versionFile="";
              if(backend.version_file){
                const versionStat=fs.lstatSync(backend.version_file);
                if(!versionStat.isFile() || versionStat.isSymbolicLink() || versionStat.nlink!==1 || versionStat.size>64*1024) throw new Error(`invalid backend version file: ${backend.name}`);
                versionFile=`\n${fs.readFileSync(backend.version_file,"utf8")}`;
              }
              const output=`${result.stdout||""}\n${result.stderr||""}${versionFile}`;
              if(!(new RegExp(backend.version_pattern)).test(output)) throw new Error(`version mismatch: ${backend.name}`);
            }
          '

      - name: Verify cryptographic signature and attestations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ref="$STATIC_IMAGE@${{ needs.static-build-push.outputs.digest }}"
          identity='^https://github.com/Last-emo-boy/rikune/.github/workflows/publish-npm.yml@refs/tags/v1.4.1$'
          cosign verify "$ref" --certificate-identity-regexp "$identity" --certificate-oidc-issuer https://token.actions.githubusercontent.com
          gh attestation verify "oci://$ref" --repo "$GITHUB_REPOSITORY" --predicate-type https://slsa.dev/provenance/v1
          gh attestation verify "oci://$ref" --repo "$GITHUB_REPOSITORY" --predicate-type https://spdx.dev/Document/v2.3

  static-version-alias:
    name: Bind immutable v1.4.1 OCI before npm exposure
    needs: [preflight, static-verify]
    if: needs.preflight.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.contract.outputs.digest }}
    steps:
      - name: Checkout release contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Publish or verify immutable v1.4.1 OCI tag
        id: contract
        shell: bash
        env:
          RELEASE_PHASE: ${{ needs.preflight.outputs.phase }}
          VERIFIED_DIGEST: ${{ needs.static-verify.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$VERIFIED_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$RELEASE_PHASE" == stage || "$RELEASE_PHASE" == verify-human-published ]]
          source="$STATIC_IMAGE@$VERIFIED_DIGEST"
          versioned="$STATIC_IMAGE:$RELEASE_VERSION"
          inspect_error=$(mktemp)
          if existing=$(docker buildx imagetools inspect "$versioned" 2>"$inspect_error"); then
            existing_digest=$(awk '/^Digest:/ {print $2; exit}' <<<"$existing")
            test "$existing_digest" = "$VERIFIED_DIGEST"
          elif [[ "$RELEASE_PHASE" == stage ]] && bash scripts/registry-ref-is-absent.sh "$versioned" "$inspect_error"; then
            docker buildx imagetools create --tag "$versioned" "$source"
          elif [[ "$RELEASE_PHASE" == verify-human-published ]]; then
            cat "$inspect_error" >&2
            echo "Immutable OCI $versioned must exist before human npm publication; refusing to repair it afterward." >&2
            exit 1
          else
            cat "$inspect_error" >&2
            echo "Unable to prove that immutable OCI $versioned is absent; refusing to publish." >&2
            exit 1
          fi
          immutable_digest=$(docker buildx imagetools inspect "$versioned" | awk '/^Digest:/ {print $2; exit}')
          test "$immutable_digest" = "$VERIFIED_DIGEST"
          echo "digest=$immutable_digest" >> "$GITHUB_OUTPUT"

  npm-candidate-ceremony:
    name: Expose npm candidate only after versioned OCI exists
    needs: [preflight, hybrid-build-verify, static-version-alias]
    if: >-
      needs.preflight.outputs.dry_run != 'true' &&
      needs.preflight.outputs.phase == 'stage'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Rebuild and bind exact npm candidate
        id: pack
        shell: bash
        env:
          EXPECTED_INTEGRITY: ${{ needs.preflight.outputs.integrity }}
          STATIC_OCI_DIGEST: ${{ needs.static-version-alias.outputs.digest }}
          HYBRID_IMAGE_REVISION: ${{ needs.hybrid-build-verify.outputs.revision }}
        run: |
          set -euo pipefail
          npm install --global npm@10.9.0 --ignore-scripts
          test "$(npm --version)" = 10.9.0
          npm ci
          npm run build
          test "$HYBRID_IMAGE_REVISION" = "$GITHUB_SHA"
          npm pkg set "gitHead=$GITHUB_SHA"
          npm pack --ignore-scripts --json > npm-pack-metadata.json
          tarball=$(node -e "const x=require('./npm-pack-metadata.json'); if(x.length!==1)process.exit(1); process.stdout.write(x[0].filename)")
          integrity=$(node -e "const x=require('./npm-pack-metadata.json'); process.stdout.write(x[0].integrity)")
          test "$integrity" = "$EXPECTED_INTEGRITY"
          test "$(tar -xOf "$tarball" package/package.json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).gitHead||""))')" = "$GITHUB_SHA"
          node scripts/verify-release-package.mjs "$tarball" "$RELEASE_VERSION"
          # JavaScript template interpolation must remain literal for Node.
          # shellcheck disable=SC2016
          RELEASE_TARBALL="$tarball" RELEASE_INTEGRITY="$integrity" node -e '
            const fs=require("fs");
            const manifest={
              schema_version:1,
              artifact_name:"npm-release-candidate",
              package:process.env.NPM_PACKAGE,
              version:process.env.RELEASE_VERSION,
              tag:process.env.RELEASE_TAG,
              commit:process.env.GITHUB_SHA,
              ref:process.env.GITHUB_REF,
              repository:process.env.GITHUB_REPOSITORY,
              workflow:process.env.GITHUB_WORKFLOW,
              run_id:process.env.GITHUB_RUN_ID,
              run_attempt:process.env.GITHUB_RUN_ATTEMPT,
              run_url:`https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
              tarball:process.env.RELEASE_TARBALL,
              integrity:process.env.RELEASE_INTEGRITY,
              static_oci_digest:process.env.STATIC_OCI_DIGEST,
              static_oci_verified:true,
              hybrid_image_revision:process.env.HYBRID_IMAGE_REVISION,
              hybrid_image_verified:true,
            };
            fs.writeFileSync("release-candidate-manifest.json",`${JSON.stringify(manifest,null,2)}\n`);
          '
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      - name: Upload immutable npm candidate for human 2FA ceremony
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-release-candidate
          path: |
            ${{ steps.pack.outputs.tarball }}
            npm-pack-metadata.json
            release-candidate-manifest.json
            DISCLOSURE
          if-no-files-found: error
          retention-days: 7

  npm-human-publication-verify:
    name: Verify package published by human npm 2FA ceremony
    needs: [preflight, hybrid-build-verify, static-version-alias]
    if: >-
      needs.preflight.outputs.dry_run != 'true' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.release_phase == 'verify-human-published'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: Poll and verify exact registry artifact
        shell: bash
        env:
          EXPECTED_INTEGRITY: ${{ needs.preflight.outputs.integrity }}
        run: |
          set -euo pipefail
          expected="$EXPECTED_INTEGRITY"
          test -n "$expected"
          for _attempt in $(seq 1 12); do
            if value=$(npm view "$NPM_PACKAGE@$RELEASE_VERSION" dist.integrity --json --registry "$NPM_REGISTRY_URL" 2>/dev/null); then
              actual=$(node -e 'process.stdout.write(JSON.parse(process.argv[1]))' "$value")
              version=$(npm view "$NPM_PACKAGE@$RELEASE_VERSION" version --json --registry "$NPM_REGISTRY_URL")
              actual_version=$(node -e 'process.stdout.write(JSON.parse(process.argv[1]))' "$version")
              commit=$(npm view "$NPM_PACKAGE@$RELEASE_VERSION" gitHead --json --registry "$NPM_REGISTRY_URL")
              actual_commit=$(node -e 'process.stdout.write(JSON.parse(process.argv[1]))' "$commit")
              latest=$(npm view "$NPM_PACKAGE" dist-tags.latest --json --registry "$NPM_REGISTRY_URL")
              actual_latest=$(node -e 'process.stdout.write(JSON.parse(process.argv[1]))' "$latest")
              test "$actual" = "$expected"
              test "$actual_version" = "$RELEASE_VERSION"
              test "$actual_commit" = "$GITHUB_SHA"
              test "$actual_latest" = "$RELEASE_VERSION"
              exit 0
            fi
            sleep 10
          done
          echo "npm registry did not converge" >&2
          exit 1

  release-and-alias:
    name: Publish OCI aliases and GitHub Release
    needs: [hybrid-build-verify, static-version-alias, npm-human-publication-verify]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout and revalidate immutable release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Close remote tag move window
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test '${{ needs.hybrid-build-verify.outputs.revision }}' = "$GITHUB_SHA"
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git cat-file -t "$RELEASE_TAG")" = tag
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
          mapfile -t remote_tag < <(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")
          test "${#remote_tag[@]}" = 2
          remote_commit=$(printf '%s\n' "${remote_tag[@]}" | awk '/\^\{\}$/ {print $1}')
          test "$remote_commit" = "$GITHUB_SHA"
          tag_object=$(git rev-parse "$RELEASE_TAG^{tag}")
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq .object.type)" = tag
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object" --jq .object.sha)" = "$GITHUB_SHA"

      - name: Download verified npm evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-release-evidence
          path: release-package

      - name: Download static OCI evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: static-oci-evidence
          path: static-evidence

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Publish and verify registry aliases
        shell: bash
        run: |
          set -euo pipefail
          digest='${{ needs.static-version-alias.outputs.digest }}'
          source="$STATIC_IMAGE@$digest"
          immutable_digest=$(docker buildx imagetools inspect "$STATIC_IMAGE:$RELEASE_VERSION" | awk '/^Digest:/ {print $2; exit}')
          test "$immutable_digest" = "$digest"
          for alias in 1.4 latest; do
            docker buildx imagetools create --tag "$STATIC_IMAGE:$alias" "$source"
            actual=$(docker buildx imagetools inspect "$STATIC_IMAGE:$alias" | awk '/^Digest:/ {print $2; exit}')
            test "$actual" = "$digest"
          done

      - name: Create verified GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v1.4.1
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            npm: rikune@1.4.1 (human 2FA publication verified)
            Static OCI: ghcr.io/last-emo-boy/rikune-analyzer-static@${{ needs.static-version-alias.outputs.digest }}
            Hybrid Dockerfile: linux/amd64 build and hardened startup verified at ${{ needs.hybrid-build-verify.outputs.revision }}
          files: |
            release-package/*.tgz
            static-evidence/static-image-digest.txt
            static-evidence/static-image.spdx.json
            static-evidence/static-profile.lock.json
